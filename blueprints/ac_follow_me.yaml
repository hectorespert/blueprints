blueprint:
  name: Virtual Follow Me AC v1
  description: >
    Basic Follow Me system.
    Compares the external sensor (user's real zone) with the AC's internal
    sensor and adjusts the setpoint to compensate the difference.

    Formula: setpoint = user_target - (external_temp - internal_temp) * gain
  domain: automation

  input:

    climate_entity:
      name: Air conditioner
      selector:
        entity:
          domain: climate

    external_sensor:
      name: External temperature sensor (user zone)
      selector:
        entity:
          domain: sensor
          device_class: temperature

    user_target:
      name: Target temperature (input_number)
      selector:
        entity:
          domain: input_number

    gain:
      name: Correction gain
      description: >
        Adjustment intensity:
        0.5 soft / 0.7 recommended / 1.0 direct
      default: 0.7
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1

    max_offset:
      name: Maximum correction (°C)
      default: 2
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5

    hysteresis:
      name: Hysteresis (°C)
      description: >
        Minimum setpoint change required before sending a command.
        Prevents oscillations when temperature fluctuates near the setpoint.
        Default 0.5 matches the rounding step and avoids redundant updates.
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.5

    diagnostics_helper:
      name: Diagnostics helper (optional)
      description: >
        Optional input_text helper used to store the last Follow Me
        calculation for debugging.
      default: ""
      selector:
        entity:
          domain: input_text


trigger:

  - platform: state
    entity_id: !input external_sensor

  - platform: state
    entity_id: !input user_target

  - platform: state
    entity_id: !input climate_entity

variables:

  climate: !input climate_entity
  external_sensor_id: !input external_sensor
  user_target_id: !input user_target
  gain_val: !input gain
  max_offset_val: !input max_offset
  hysteresis_val: !input hysteresis
  diagnostics_helper_id: !input diagnostics_helper

  # Base comfort target set by the user
  target: >
    {{ states(user_target_id) | float(0) }}

  # Temperature read from the external sensor (user's real zone)
  external_temp: >
    {{ states(external_sensor_id) | float(0) }}

  # Temperature read from the AC's internal sensor (biased zone)
  internal_temp: >
    {{ state_attr(climate, 'current_temperature') | float(0) }}

  # Proportional offset scaled by gain
  raw_offset: >
    {{ (external_temp - internal_temp) * gain_val }}

  # Clamp offset to avoid overcorrection
  bounded_offset: >
    {% set o = raw_offset %}
    {% if o > max_offset_val %}
      {{ max_offset_val }}
    {% elif o < -max_offset_val %}
      {{ -max_offset_val }}
    {% else %}
      {{ o }}
    {% endif %}

  # Final setpoint rounded to nearest 0.5°C
  final_setpoint: >
    {{ ((target - bounded_offset) * 2) | round(0) / 2 }}

  # Current target temperature in the AC
  current_setpoint: >
    {{ state_attr(climate, 'temperature') | float(0) }}

  # Whether the calculated setpoint change is large enough to apply
  should_apply: >
    {{ (final_setpoint - current_setpoint) | abs >= hysteresis_val }}

  # Compact diagnostics string for debugging in an input_text helper
  diagnostics_message: >
    m={{ states(climate) }}
    e={{ (external_temp | float(0)) | round(1) }}
    i={{ (internal_temp | float(0)) | round(1) }}
    t={{ (target | float(0)) | round(1) }}
    o={{ (bounded_offset | float(0)) | round(1) }}
    f={{ (final_setpoint | float(0)) | round(1) }}
    c={{ (current_setpoint | float(0)) | round(1) }}
    a={{ should_apply }}


condition:

  # If triggered by climate entity, verify it's a real state change (not just attributes)
  - condition: template
    value_template: >
      {% if trigger.platform == 'state' and trigger.entity_id == climate %}
        {# Only proceed if state actually changed #}
        {% set old_state = trigger.from_state.state if trigger.from_state else states(climate) %}
        {% set new_state = trigger.to_state.state if trigger.to_state else states(climate) %}
        {{ old_state != new_state }}
      {% else %}
        {# Always proceed for external_sensor and user_target triggers #}
        true
      {% endif %}

  # Climate must be available
  - condition: template
    value_template: >
      {{ states(climate) not in ['unavailable', 'unknown'] }}

  # Only act in supported HVAC modes
  - condition: template
    value_template: >
      {{ states(climate) in ['cool', 'heat', 'heat_cool'] }}

action:

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ diagnostics_helper_id != '' }}
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input diagnostics_helper
            data:
              value: "{{ diagnostics_message }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ should_apply }}
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ final_setpoint }}"


mode: restart
