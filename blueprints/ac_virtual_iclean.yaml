blueprint:
  name: AC Virtual iClean
  description: >
    Self-cleaning cycle for indoor units whose manufacturer function is
    disabled, as happens with Bosch "I clean" on multi-split installations.

    Freezes the evaporator at the lowest setpoint and then switches the unit
    off.
  domain: automation

  input:

    climate_entity:
      name: Air conditioner
      description: Indoor unit to clean.
      selector:
        entity:
          domain: climate

    manual_trigger:
      name: Manual trigger (input_button)
      description: Button that starts the cycle.
      selector:
        entity:
          domain: input_button

    automations_to_pause:
      name: Automations to disable during the cycle
      description: >
        Automations that would fight the cycle, such as Follow Me or the
        evaporator dry cycle for this unit. They are disabled before the unit
        is touched and re-enabled once it reports being off at the end. Only
        the ones that were enabled when the cycle started are re-enabled.
      default: []
      selector:
        entity:
          domain: automation
          multiple: true

    freeze_temperature:
      name: Freeze setpoint (C)
      description: >
        Setpoint used during the freeze stage. Values below the unit's own
        minimum (its min_temp attribute) are raised to that minimum, because
        the unit rejects them.
      default: 16
      selector:
        number:
          min: 16
          max: 24
          step: 0.5

    freeze_minutes:
      name: Freeze time (minutes)
      default: 12
      selector:
        number:
          min: 1
          max: 30
          step: 1


trigger:

  - platform: state
    entity_id: !input manual_trigger


variables:

  climate: !input climate_entity
  paused_automations: !input automations_to_pause
  # Restoring every configured automation would revive one the user had
  # already disabled before pressing the button.
  automations_originally_on: >
    {{ expand(paused_automations) | selectattr('state', 'eq', 'on')
       | map(attribute='entity_id') | list }}
  freeze_temp_input: !input freeze_temperature
  # A setpoint below min_temp is rejected outright (seen on a real multi-split
  # unit with min_temp 17), which would leave the unit cooling at whatever
  # setpoint it had before.
  freeze_temp_val: >
    {{ [freeze_temp_input | float,
        state_attr(climate, 'min_temp') | float(0)] | max }}
  freeze_minutes_val: !input freeze_minutes


action:

  # Silence rivals before the unit is touched at all.
  - if:
      - condition: template
        value_template: "{{ automations_originally_on | count > 0 }}"
    then:
      - service: automation.turn_off
        target:
          entity_id: "{{ automations_originally_on }}"
        data:
          # Cut short any correction already in flight.
          stop_actions: true

  # Stage 1: freeze.
  - service: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: cool

  # Midea-based units silently drop a set_temperature that arrives while the
  # mode switch is still being processed.
  - delay:
      seconds: 3

  - service: climate.set_temperature
    target:
      entity_id: !input climate_entity
    data:
      temperature: "{{ freeze_temp_val | float }}"

  - delay:
      minutes: "{{ freeze_minutes_val | int }}"

  - service: climate.turn_off
    target:
      entity_id: !input climate_entity

  # Re-enable only once the unit reports 'off'. The integration takes a few
  # seconds to report it, and the evaporator dry cycle triggers on any change
  # to 'off': re-enabled any sooner, it would catch our own switch-off.
  - wait_template: "{{ states(climate) == 'off' }}"
    timeout:
      minutes: 2
    continue_on_timeout: true

  - if:
      - condition: template
        value_template: "{{ automations_originally_on | count > 0 }}"
    then:
      - service: automation.turn_on
        target:
          entity_id: "{{ automations_originally_on }}"


mode: single
max_exceeded: silent
