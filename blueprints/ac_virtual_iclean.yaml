blueprint:
  name: AC Virtual iClean
  description: >
    Self-cleaning cycle for indoor units whose manufacturer function is
    disabled, as happens with Bosch "I clean" on multi-split installations.

    Freezes the evaporator at the lowest setpoint and then switches the unit
    off.
  domain: automation

  input:

    climate_entity:
      name: Air conditioner
      description: Indoor unit to clean.
      selector:
        entity:
          domain: climate

    manual_trigger:
      name: Manual trigger (input_button)
      description: Button that starts the cycle.
      selector:
        entity:
          domain: input_button

    freeze_temperature:
      name: Freeze setpoint (C)
      description: >
        Setpoint used during the freeze stage. Use the lowest value the unit
        accepts.
      default: 16
      selector:
        number:
          min: 16
          max: 24
          step: 0.5

    freeze_minutes:
      name: Freeze time (minutes)
      default: 12
      selector:
        number:
          min: 1
          max: 30
          step: 1


trigger:

  - platform: state
    entity_id: !input manual_trigger


variables:

  freeze_temp_val: !input freeze_temperature
  freeze_minutes_val: !input freeze_minutes


action:

  # Stage 1: freeze.
  - service: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: cool

  # Midea-based units silently drop a set_temperature that arrives while the
  # mode switch is still being processed.
  - delay:
      seconds: 3

  - service: climate.set_temperature
    target:
      entity_id: !input climate_entity
    data:
      temperature: "{{ freeze_temp_val | float }}"

  - delay:
      minutes: "{{ freeze_minutes_val | int }}"

  - service: climate.turn_off
    target:
      entity_id: !input climate_entity


mode: single
max_exceeded: silent
